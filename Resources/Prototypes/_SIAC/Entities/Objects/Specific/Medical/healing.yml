- type: entity
  name: Packing Bandage
  description: A bundle of gauze for application on deep wounds.
  parent: BaseHealingItem
  id: PackingBandage
  suffix: Full
  components:
  - type: Tag
    tags:
    - Brutepack
  - type: Sprite
    state: brutepack
  - type: Item
    heldPrefix: brutepack
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Piercing: -5
        Slash: -5
    bloodlossModifier: -5
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: Stack
    stackType: PackingBandage
    count: 10
  - type: StackPrice
    price: 5

- type: entity
  id: PackingBandage1
  parent: PackingBandage
  suffix: Single
  components:
  - type: Stack
    stackType: PackingBandage
    count: 1

